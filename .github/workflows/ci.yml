name: Build

on:
  push:
  pull_request:

jobs:
  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:sidebar
      - run: npm run test:stress
      - run: npm run package:vsix
