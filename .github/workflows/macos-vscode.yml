name: Build macOS VS Code installer

on:
  push:
    branches:
      - macbook_vs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: chmod +x macos/vscode/build-dmg.sh
      - run: macos/vscode/build-dmg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: DVS-Plugin-VSCode-macOS-0.4.0
          path: DVS-Plugin-VSCode-macOS-0.4.0.dmg
          if-no-files-found: error
